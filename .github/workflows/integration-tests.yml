name: integration tests
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
on:
  pull_request: { types: [opened, reopened, synchronize, ready_for_review] }
  push: { branches: [main] }

jobs:
  tests:
    if: ${{ github.event_name == 'push' || (github.event.pull_request.base.repo.id == github.event.pull_request.head.repo.id && !github.event.pull_request.draft) }}
    runs-on: ubuntu-latest
    container: swift:6.4-resolute
    timeout-minutes: 30
    steps:
      - name: Check out package
        uses: actions/checkout@v7

      - name: Install curl for codecov, zstd for the cache action
        run: |
          apt-get update
          apt-get install -y curl zstd

      - name: Determine cache key prefix
        id: "cache-key-prefix"
        run: echo "prefix=${{ github.event.repository.name }}-integration-tests-build-${{ runner.os }}-${SWIFT_PLATFORM}-${SWIFT_VERSION}-" >> "${GITHUB_OUTPUT}"

      - name: Restore .build
        if: ${{ runner.debug != '1' }}
        id: "restore-cache"
        uses: actions/cache/restore@v6
        with:
          path: .build
          key: "${{ steps.cache-key-prefix.outputs.prefix }}${{ hashFiles('./Package.resolved') }}"
          restore-keys: "${{ steps.cache-key-prefix.outputs.prefix }}"

      - name: Build ${{ github.event.repository.name }}
        run: |
          swift build \
            --build-tests \
            --enable-code-coverage \
            --disable-experimental-prebuilts \
            --explicit-target-dependency-import-check error

      - name: Cache .build
        if: steps.restore-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: .build
          key: "${{ steps.cache-key-prefix.outputs.prefix }}${{ hashFiles('./Package.resolved') }}"

      - name: Run tests
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
        run: |
          swift test \
            --skip-build \
            --filter IntegrationTests \
            --sanitize=thread \
            --enable-code-coverage \
            --disable-experimental-prebuilts

      - name: Upload code coverage
        uses: vapor/swift-codecov-action@v0.3.7
        with:
          codecov_token: ${{ secrets.CODECOV_TOKEN }}
          env_vars: "SWIFT_VERSION,SWIFT_PLATFORM,RUNNER_OS,RUNNER_ARCH"
